name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix develop --command nixfmt -c $(git ls-files '*.nix')

      - name: Evaluate flake
        run: nix flake check --no-build

      # Evaluation does not catch a stale U-Boot hash/defconfig or a broken
      # cross build. U-Boot is the cheapest real build artifact to check.
      - name: Build U-Boot
        run: nix build .#uboot --no-link
